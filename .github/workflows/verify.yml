name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main', 'develop']

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm exec biome check

      - name: Type check
        run: pnpm exec tsc --noEmit --pretty false

      - name: Unit tests with coverage
        run: pnpm exec vitest run --coverage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only chromium: playwright.config.ts defines one project, and the specs
      # cover public surfaces that need no secrets, so this job has no setup
      # beyond the browser binary.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # `pnpm exec playwright test` starts the app through the config's
      # webServer (pnpm dev), on an empty local Miniflare D1 that the specs
      # treat as "no application link".
      - name: End-to-end tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
