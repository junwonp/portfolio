n" font-weight="normal"> 인트라넷</tspan></tspan><tspan class="text-outer-tspan row" x="0" y="1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">로컬</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> 개발에서</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> 외부</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> 서비스와</tspan></tspan><tspan class="text-outer-tspan row" x="0" y="2.1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">운영</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> 데이터를</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> 사용하지</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> 않음</tspan></tspan></text></g></g></g><g class="node default" id="my-svg-flowchart-2-1" data-look="classic" transform="translate(133.5234375, 181.29999542236328)"><rect class="basic label-container" style="" x="-118.015625" y="-41.099998474121094" width="236.03125" height="82.19999694824219"/><g class="label" style="" transform="translate(0, -26.099998474121094)"><rect/><g><rect class="background" style="stroke: none"/><text y="-10.1" style=""><tspan class="text-outer-tspan row" x="0" y="-0.1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">2.</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> Mock</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> 소켓</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> 레이어</tspan></tspan><tspan class="text-outer-tspan row" x="0" y="1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">Socket.IO와</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> 동일한</tspan><tspan font-style="normal" class="text-inner-tspan" font-weig